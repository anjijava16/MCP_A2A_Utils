[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-agent"
version = "0.1.0"
description = "Prototype Google ADK weather agent backed by the workspace MCP weather tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"google-adk",
	"httpx>=0.27.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
